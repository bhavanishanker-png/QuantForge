[databases]
quantforge = host=postgres port=5432 dbname=quantforge

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; deliberately tiny pool so many client transactions share few server connections
default_pool_size = 3
max_client_conn = 500
ignore_startup_parameters = extra_float_digits,options
max_prepared_statements = 0
; Defense in depth (ADR-002): wipe session state after EVERY transaction so a stray
; session-level SET can never leak a tenant context to another client.
server_reset_query = RESET ALL
server_reset_query_always = 1
