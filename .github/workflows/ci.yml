name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, types, unit tests, contract drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate -w @quantforge/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -w @quantforge/web
      - name: OpenAPI contract is up to date (ADR-001)
        run: |
          npm run openapi
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts \
            || (echo "::error::Generated API contract is stale. Run 'npm run openapi' and commit the result." && exit 1)

  python:
    name: Python (ruff, mypy)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: quant-engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { version: '0.11.32' }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  integration:
    name: Integration (isolation, pipeline, browser)
    runs-on: ubuntu-latest
    needs: [typescript, python]
    env:
      HEARTBEAT_EVERY_S: '1'
      STALE_AFTER_S: '5'
      REAPER_EVERY_S: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: astral-sh/setup-uv@v7
        with: { version: '0.11.32' }
      - name: Generate a throwaway .env
        run: ./scripts/gen-secrets.sh
      - name: Start the full stack
        run: docker compose up -d --build --wait
      - run: npm ci
      - run: npm run db:generate -w @quantforge/api
      - name: API e2e (auth, RBAC, workspace isolation)
        run: npm run test:e2e -w @quantforge/api
      - name: Engine tests (schema drift, worker RLS, job lifecycle)
        working-directory: quant-engine
        run: uv sync --frozen && uv run pytest -q
      - name: Full-stack job pipeline (incl. worker kill)
        run: npm run test:pipeline -w @quantforge/api
      - name: Browser tests
        run: |
          npx -w @quantforge/web playwright install --with-deps chromium
          npm run test:e2e -w @quantforge/web
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
